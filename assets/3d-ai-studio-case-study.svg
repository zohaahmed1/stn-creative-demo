<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Satoshi, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="tdLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#5500DD"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cubeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cubeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cubeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Left visual panel -->
  <rect x="0" y="0" width="696" height="675" fill="url(#tdLeft)"/>
  <g fill="#ffffff" opacity="0.07">
    <circle cx="90" cy="110" r="3"/><circle cx="150" cy="110" r="3"/><circle cx="210" cy="110" r="3"/>
    <circle cx="90" cy="170" r="3"/><circle cx="150" cy="170" r="3"/><circle cx="210" cy="170" r="3"/>
  </g>
  <text x="72" y="150" fill="#ffffff" opacity="0.85" font-size="20" font-weight="700" letter-spacing="3">AI SaaS · REDDIT ADS</text>
  <text x="70" y="236" fill="#ffffff" font-size="70" font-weight="900" letter-spacing="-2">3D AI Studio</text>
  <text x="72" y="284" fill="#ffffff" opacity="0.8" font-size="26" font-weight="500">Text-to-3D model generation</text>

  <!-- Abstract 3D shapes -->
  <g transform="translate(120,360)">
    <!-- rounded cube 1 -->
    <rect x="0" y="40" width="150" height="150" rx="26" fill="url(#cubeA)" transform="rotate(-8 75 115)"/>
    <!-- sphere -->
    <circle cx="300" cy="90" r="78" fill="url(#cubeB)"/>
    <circle cx="278" cy="66" r="22" fill="#ffffff" opacity="0.5"/>
    <!-- rounded cube 2 -->
    <rect x="380" y="70" width="130" height="130" rx="24" fill="url(#cubeC)" transform="rotate(10 445 135)"/>
    <!-- small torus-ish ring -->
    <circle cx="150" cy="220" r="42" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.55"/>
  </g>

  <!-- Right dark stat panel -->
  <rect x="696" y="0" width="504" height="675" fill="#0a0520"/>

  <!-- Stat 1 -->
  <text x="748" y="196" fill="#FF6B35" font-size="108" font-weight="900" letter-spacing="-4">€30</text>
  <text x="750" y="238" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">CPA AFTER 90 DAYS</text>

  <!-- Stat 2 -->
  <text x="748" y="392" fill="#22c55e" font-size="108" font-weight="900" letter-spacing="-4">30%<tspan font-size="60" dy="-4"> ↑</tspan></text>
  <text x="750" y="434" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">MORE SUBSCRIPTIONS</text>

  <!-- Stat 3 -->
  <text x="748" y="560" fill="#a78bfa" font-size="72" font-weight="900" letter-spacing="-2">$10K<tspan font-size="40">/mo</tspan></text>
  <text x="750" y="598" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">SCALED AD SPEND</text>

  <!-- Reddit badge (top-right) -->
  <g transform="translate(1140,58)">
    <circle cx="0" cy="0" r="28" fill="#FF4500"/>
    <g transform="translate(-15,-15)">
      <circle cx="15" cy="16" r="11" fill="#ffffff"/>
      <circle cx="10.5" cy="15.5" r="1.6" fill="#FF4500"/>
      <circle cx="19.5" cy="15.5" r="1.6" fill="#FF4500"/>
      <path d="M11 19.5c1 1 2.6 1.3 4 1.3s3-.3 4-1.3" stroke="#FF4500" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="24" cy="8.5" r="2.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
