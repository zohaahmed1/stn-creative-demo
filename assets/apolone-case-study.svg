<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Satoshi, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="apoLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5500DD"/>
      <stop offset="0.55" stop-color="#8b16d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="apoBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Left visual panel -->
  <rect x="0" y="0" width="696" height="675" fill="url(#apoLeft)"/>
  <!-- soft dot texture -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="90" cy="110" r="3"/><circle cx="150" cy="110" r="3"/><circle cx="210" cy="110" r="3"/>
    <circle cx="90" cy="170" r="3"/><circle cx="150" cy="170" r="3"/><circle cx="210" cy="170" r="3"/>
  </g>
  <!-- eyebrow -->
  <text x="72" y="150" fill="#ffffff" opacity="0.85" font-size="20" font-weight="700" letter-spacing="3">MUSIC SaaS · TIKTOK</text>
  <!-- wordmark -->
  <text x="70" y="238" fill="#ffffff" font-size="76" font-weight="900" letter-spacing="-2">Apolone</text>
  <text x="72" y="286" fill="#ffffff" opacity="0.8" font-size="26" font-weight="500">Song analyzer for artists</text>

  <!-- audio waveform / equalizer -->
  <g transform="translate(72,360)">
    <rect x="0"   y="60"  width="20" height="90"  rx="10" fill="url(#apoBar)"/>
    <rect x="34"  y="20"  width="20" height="170" rx="10" fill="url(#apoBar)"/>
    <rect x="68"  y="90"  width="20" height="60"  rx="10" fill="url(#apoBar)"/>
    <rect x="102" y="0"   width="20" height="210" rx="10" fill="url(#apoBar)"/>
    <rect x="136" y="50"  width="20" height="110" rx="10" fill="url(#apoBar)"/>
    <rect x="170" y="110" width="20" height="40"  rx="10" fill="url(#apoBar)"/>
    <rect x="204" y="30"  width="20" height="160" rx="10" fill="url(#apoBar)"/>
    <rect x="238" y="80"  width="20" height="80"  rx="10" fill="url(#apoBar)"/>
    <rect x="272" y="10"  width="20" height="190" rx="10" fill="url(#apoBar)"/>
    <rect x="306" y="70"  width="20" height="90"  rx="10" fill="url(#apoBar)"/>
    <rect x="340" y="40"  width="20" height="140" rx="10" fill="url(#apoBar)"/>
    <rect x="374" y="95"  width="20" height="55"  rx="10" fill="url(#apoBar)"/>
    <rect x="408" y="25"  width="20" height="165" rx="10" fill="url(#apoBar)"/>
    <rect x="442" y="75"  width="20" height="85"  rx="10" fill="url(#apoBar)"/>
    <rect x="476" y="45"  width="20" height="130" rx="10" fill="url(#apoBar)"/>
  </g>

  <!-- Right dark stat panel -->
  <rect x="696" y="0" width="504" height="675" fill="#0a0520"/>

  <!-- Stat 1 -->
  <text x="748" y="196" fill="#FF6B35" font-size="108" font-weight="900" letter-spacing="-4">$70</text>
  <text x="750" y="238" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">COST PER PURCHASE</text>

  <!-- Stat 2 -->
  <text x="748" y="392" fill="#22c55e" font-size="108" font-weight="900" letter-spacing="-4">30%<tspan font-size="60" dy="-4"> ↓</tspan></text>
  <text x="750" y="434" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">LOWER CPA FROM COPY TEST</text>

  <!-- Stat 3 -->
  <text x="748" y="560" fill="#a78bfa" font-size="72" font-weight="900" letter-spacing="-2">$30K</text>
  <text x="750" y="598" fill="#ffffff" opacity="0.72" font-size="21" font-weight="700" letter-spacing="1.5">AD SPEND MANAGED · 3 MONTHS</text>

  <!-- TikTok badge (top-right) -->
  <g transform="translate(1140,58)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" opacity="0.08"/>
    <path transform="translate(-15,-16) scale(1.0)" fill="#ffffff" d="M23.5 4c.4 2.9 2 5.4 4.5 6.6 1 .5 2.1.8 3.2.9v4.4c-2.1 0-4.1-.6-5.9-1.6v7.2c0 3.7-3 6.7-6.7 6.7s-6.7-3-6.7-6.7 3-6.7 6.7-6.7c.4 0 .7 0 1.1.1v4.5c-.3-.1-.7-.2-1.1-.2-1.3 0-2.3 1-2.3 2.3s1 2.3 2.3 2.3 2.3-1 2.3-2.3V4h3.3z"/>
  </g>
</svg>
